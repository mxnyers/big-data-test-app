version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./src/cache/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      # Redis connection via service DNS name `redis`
      REDIS_URL: redis://redis:6379
      # Databricks (fill these for real use)
      DATABRICKS_SERVER_HOSTNAME: ${DATABRICKS_SERVER_HOSTNAME:-}
      DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-changeme}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8081:80"    # http://localhost:8081
