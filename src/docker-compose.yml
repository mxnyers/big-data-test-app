services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      # Postgres connection string (AWS RDS / Aurora)
      DATABASE_URL: ${DATABASE_URL:-}
      # OpenTelemetry exporter endpoint for traces
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-big-data-test-api}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-changeme}
      LOG_DIR: /app/logs
    ports:
      - "8080:8080"
    volumes:
      - ./api/logs:/app/logs
    expose:
      - "8080"
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8081:80"    # http://localhost:8081
